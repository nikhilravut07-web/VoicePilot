[voicepilot-ivr]
; VoicePilot Clinic IVR — extension 1004

; Entry point
exten => 1004,1,NoOp(VoicePilot IVR entry point)
 same => n,Answer()
 same => n,Set(LOOP_COUNT=0)

; Menu start
 same => n(menu),NoOp(VoicePilot menu attempt ${LOOP_COUNT})
 same => n,Set(LOOP_COUNT=$[${LOOP_COUNT} + 1])
 same => n,Read(DIGIT,/usr/share/asterisk/sounds/voicepilot/clinic-menu,1,,,5)

; Timeout or empty input
 same => n,GotoIf($["${DIGIT}" = ""]?invalid)

; Keypad selections
 same => n,GotoIf($["${DIGIT}" = "1"]?appointment)
 same => n,GotoIf($["${DIGIT}" = "2"]?info)

; Invalid input — maximum THREE attempts
 same => n(invalid),NoOp(Invalid input received: ${DIGIT})
 same => n,Playback(/usr/share/asterisk/sounds/en_US_f_Allison/please-try-again)
 same => n,GotoIf($[${LOOP_COUNT} < 3]?menu)
 same => n,Playback(/usr/share/asterisk/sounds/en_US_f_Allison/goodbye)
 same => n,Hangup()

; Option 1: Appointment booking
 same => n(appointment),NoOp(User selected Appointment Booking)
 same => n,Playback(/usr/share/asterisk/sounds/en_US_f_Allison/auth-thankyou)
 same => n,Log(NOTICE, [VoicePilot] Call ${CHANNEL(name)} selected Appointment Booking)
 same => n,Hangup()

; Option 2: Clinic information
 same => n(info),NoOp(User selected Clinic Information)
 same => n,Playback(/usr/share/asterisk/sounds/en_US_f_Allison/auth-thankyou)
 same => n,Log(NOTICE, [VoicePilot] Call ${CHANNEL(name)} selected Clinic Information)
 same => n,Hangup()
